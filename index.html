<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPinjam — Layanan & Pembatalan</title>
  <meta name="description" content="Website profil bisnis SPinjam — Layanan & Pembatalan. Buka 24 jam.">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#0d0f10;color:#fff}
    body{min-height:100vh}
    .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px;
      background:radial-gradient(circle at 50% 10%,#153b35 0,#0d0f10 42%,#080909 100%)}
    .card{width:min(520px,100%);overflow:hidden;border-radius:28px;background:#151718;
      box-shadow:0 25px 70px rgba(0,0,0,.45);border:1px solid #252929}
    .cover{height:170px;background:linear-gradient(135deg,#0f766e,#19a88d 55%,#86d8c2);position:relative}
    .cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.28))}
    .avatar-wrap{position:relative;margin:-68px auto 0;width:138px;height:138px;border-radius:50%;
      padding:5px;background:#202525;border:3px solid #3a4543;z-index:2}
    .avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
    .verified{position:absolute;right:-1px;bottom:8px;width:38px;height:38px;border-radius:50%;
      background:#1597d3;display:grid;place-items:center;border:4px solid #151718;font-weight:900;font-size:21px}
    .content{text-align:center;padding:0 28px 30px}
    h1{font-size:34px;margin:18px 0 5px}
    .phone{color:#9aa4a6;font-size:17px}
    .tag{display:inline-block;margin-top:16px;padding:9px 15px;border-radius:12px;background:#222728;color:#aab2b3;font-size:14px}
    .open{margin:28px 0 20px;color:#13b875;font-size:18px;font-weight:700}
    .open span{color:#aab2b3;font-weight:400}
    .wa{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:#fff;
      background:#00a884;border-radius:18px;padding:18px 20px;font-weight:800;letter-spacing:1px;font-size:16px;
      transition:.2s;box-shadow:0 10px 25px rgba(0,168,132,.22)}
    .wa:hover{transform:translateY(-2px);background:#06b98f}
    .info{margin-top:18px;padding:22px;border-radius:20px;background:#101212;border:1px solid #272c2c;text-align:left}
    .info h2{margin:0 0 16px;color:#a5e8d3;font-size:20px}
    .row{display:flex;justify-content:space-between;gap:20px;padding:10px 0;color:#ddd}
    .green{color:#0cc477;font-weight:700}
    footer{text-align:center;color:#7e8889;font-size:12px;padding:20px}
    @media(max-width:420px){.cover{height:145px}.content{padding:0 20px 24px}.avatar-wrap{width:126px;height:126px}h1{font-size:30px}}
  </style>
</head>
<body>
  <main class="hero">
    <section class="card">
      <div class="cover"></div>
      <div class="avatar-wrap">
        <img class="avatar" src="https://media.bio.site/sites/ca629a5c-21ed-4862-8dde-88925f667cd5/6S2FB9kVzP43XAj6GwaMEe.png" alt="Foto profil SPinjam">
        <div class="verified" aria-label="Terverifikasi">✓</div>
      </div>
      <div class="content">
        <h1>Call Center SPinjam</h1>
        <div class="phone">+62 817-303-538</div>
        <div class="tag">Layanan Pembatalan SPinjam</div>
        <div class="open">● Buka <span>24 jam</span></div>
        <a class="wa" href="https://wa.me/62817303538" target="_blank" rel="noopener">
          💬 KIRIM PESAN DI WHATSAPP
        </a>
        <div class="info">
          <h2>Info bisnis ini</h2>
          <div class="row"><span class="green">Sedang buka</span><span>Buka 24 jam</span></div>
        </div>
      </div>
      <footer>Website profil bisnis SPinjam</footer>
    </section>
  </main>
</body>
</html>
